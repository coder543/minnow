[package]
name = "minnow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Block diffusion inference for LLaDA2.2"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
half = "2"
libc = "0.2"
fs2 = "0.4"
minijinja = { version = "2", features = ["loader", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmp-serde = "1.3"
blake3 = "1.8"
rayon = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
cudaforge = "0.1.6"

[profile.release]
lto = "thin"
codegen-units = 1
